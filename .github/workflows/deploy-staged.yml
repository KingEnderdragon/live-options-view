name: Deploy staged asset payload (G3b)

# Repair 5 (2026-11-12, DRAFT — not approved, not merged). The Actions
# gate is executable again. The old download-artifact step failed because
# no workflow ever uploaded an authorization-<revision> artifact, and
# the old `stage` input named a path that never exists on a fresh
# runner: the record is now created ON the execution runner by the
# approved job itself (same job, same workspace) and consumed directly
# from the external releases directory — it is never downloaded from
# another run. The stage is BUILT on the runner too (build, verify and
# stage outside the checkout), so no unusable local stage is
# transported. Release authority comes from the GitHub "production"
# environment (Owen is the required reviewer; GitHub enforces approval
# before the job runs or accesses environment secrets). NOTE: the
# "production" environment must exist as a repo setting (Settings →
# Environments) with Owen as required reviewer BEFORE the first run;
# referencing a missing environment does not create its protection
# rules, so a run against a missing environment is NOT an approved
# release.
# The job checks out the full candidate SHA explicitly, verifies the
# checkout, and queries GitHub for successful required checks against
# that SHA — caller-supplied run-id:success strings are never accepted
# as proof (the web-check / api-check inputs are removed). API
# readiness is actual evidence: a live provider readback that the
# live-options-api service exists, recorded on the runner before
# authorization (the asset binding points at that service). It then
# authorizes and deploys in the same job, and uploads the authorization
# record and receipts afterward as audit evidence (named by revision,
# target and run attempt). The evidence does not need downloading to
# authorize its own producer. The release lock and supersession are
# per-runner (single job, shared lock in the external releases dir);
# cross-run serialization is the concurrency group below. A fresh
# runner directory does NOT enforce durable cross-run supersession.
# Runner readiness: install the pinned wrangler and wire the provider
# credential explicitly (the old workflow installed only Node before
# invoking a script that expects wrangler).
# B2 — one authoritative release lane: this workflow and deploy.yml
# share the concurrency group and the gate is the only deploy
# mechanism. F1 — all inputs reach the script via env only. No ${{ }}
# expression is interpolated into any run: step; the scripts read env
# as a fallback for their flags, and double-quoted "$VAR" expansion is
# never re-scanned for command substitution.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full 40-hex revision the stage is built from'
        required: true
      execute:
        description: 'Execute the promotion (default is dry-run)'
        type: boolean
        default: false

concurrency:
  group: deploy-live-options-view
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-staged:
    runs-on: ubuntu-24.04
    # Release authority: the job runs only after the required reviewer
    # (Owen) approves it in the "production" environment. The
    # environment must be created as a repo setting first (see header).
    environment: production
    steps:
      - name: Check out the candidate revision (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - name: Verify the checkout is the candidate revision
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          git rev-parse HEAD^{tree}
      - name: Verify required checks passed for the revision
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          # Query GitHub (not the dispatcher) for a successful Web CI run
          # on the exact revision. A missing or failed check refuses the
          # deploy here, before any authorization is created.
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/web-ci.yml/runs?head_sha=${DEPLOY_REVISION}&status=completed&per_page=5" --jq '.workflow_runs[] | select(.conclusion == "success") | .id' | head -n 1)"
          if [ -z "$run_id" ]; then
            echo "No successful Web CI run for revision ${DEPLOY_REVISION}" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned deployment tooling
        # Pinned wrangler (review point: confirm the pin matches the
        # known-good version). The deploy script invokes `wrangler`
        # from PATH; without this step the executor is not installed.
        run: npm install -g wrangler@4.160.1
      - name: Build the asset artifact (on the execution runner)
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
          DEPLOY_ARTIFACT_OUT: ${{ github.workspace }}/../.deploy-artifact
        run: node scripts/build-assets.mjs --revision "$DEPLOY_REVISION" --out "$DEPLOY_ARTIFACT_OUT"
      - name: Prepare the asset stage (on the execution runner)
        env:
          DEPLOY_ARTIFACT: ${{ github.workspace }}/../.deploy-artifact
          DEPLOY_STAGE: ${{ github.workspace }}/../.deploy-stage
        run: node scripts/prepare-asset-release.mjs --artifact "$DEPLOY_ARTIFACT" --out "$DEPLOY_STAGE"
      - name: Verify the API service exists (live provider readback)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Read-only provider readback: the asset binding points at
          # live-options-api, so the service must exist before the asset
          # can be authorized. This is actual evidence (a live provider
          # read), not a transported file. The account id must match
          # wrangler.api.toml. Never print the token or a raw response.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          code="$(curl -sS --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o "$tmp/scripts.json" -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/413bc8abe4485cf2a2e0d9f534436ade/workers/scripts?per_page=100")"
          test "$code" = "200"
          jq -er --arg name "live-options-api" '.result[] | select(.id == $name) | .id' "$tmp/scripts.json" >/dev/null
      - name: Record API readiness evidence (on the execution runner)
        env:
          DEPLOY_RELEASES_DIR: ${{ github.workspace }}/../.deploy-releases
          DEPLOY_REVISION: ${{ inputs.revision }}
          DEPLOY_AUTHORIZER: ${{ github.actor }}
        run: node scripts/deploy-staged-payload.mjs --record-api-service
      - name: Authorize the asset candidate (on the execution runner)
        env:
          DEPLOY_RELEASES_DIR: ${{ github.workspace }}/../.deploy-releases
          DEPLOY_STAGE: ${{ github.workspace }}/../.deploy-stage
          DEPLOY_REVISION: ${{ inputs.revision }}
          DEPLOY_WEB_CHECK: ${{ steps.checks.outputs.run_id }}:success
          DEPLOY_API_CHECK: ${{ steps.checks.outputs.run_id }}:success
          DEPLOY_AUTHORIZER: ${{ github.actor }}
          DEPLOY_AUTHORIZE: 'true'
        run: node scripts/deploy-staged-payload.mjs --authorize --target asset
      - name: Deploy staged payload through the gate
        env:
          DEPLOY_RELEASES_DIR: ${{ github.workspace }}/../.deploy-releases
          DEPLOY_STAGE: ${{ github.workspace }}/../.deploy-stage
          DEPLOY_REVISION: ${{ inputs.revision }}
          DEPLOY_WEB_CHECK: ${{ steps.checks.outputs.run_id }}:success
          DEPLOY_API_CHECK: ${{ steps.checks.outputs.run_id }}:success
          DEPLOY_EXECUTE: ${{ inputs.execute }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-staged-payload.mjs --deploy --target asset
      - name: Upload authorization and receipts (audit evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-${{ inputs.revision }}-asset-${{ github.run_attempt }}
          path: ${{ github.workspace }}/../.deploy-releases/
          if-no-files-found: warn
