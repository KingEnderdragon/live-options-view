name: Rollback Combined Worker (explicit, gated)

# LOCAL PROPOSAL — not merged. Rollback-only lane for the combined public
# worker: workflow_dispatch only, same deploy-live-options-view concurrency
# group as deploy.yml and deploy-staged.yml, and the only deploy mechanism
# is scripts/deploy-staged-payload.mjs with --target rollback (own
# authorization record, own dispatch, own config wrangler.toml — the
# combined public worker, restored from the recorded combined code
# revision). It deploys NOTHING else: it cannot deploy the asset service
# (wrangler.assets.toml) or the API service (wrangler.api.toml). It never
# touches a producer/collector. A rollback authorization requires a
# recorded reason; its web/API checks are optional and, if omitted, are
# recorded as waived with the reason.
# B1 — The authorization record is EXTERNAL to the candidate tree: the
# authorize step uploads it as a workflow artifact named
# authorization-<revision>; this job downloads it.
# F1 — All inputs reach the script via env only; no ${{ }} expression is
# interpolated into any run: step.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full 40-hex combined code revision to restore'
        required: true
      rollback-reason:
        description: 'Recorded reason for the rollback'
        required: true
      web-check:
        description: 'Web check evidence as <run-id>:<status> (optional for rollback)'
        required: false
        default: ''
      api-check:
        description: 'API check evidence as <run-id>:<status> (optional for rollback)'
        required: false
        default: ''
      execute:
        description: 'Execute the rollback (default is dry-run)'
        type: boolean
        default: false

concurrency:
  group: deploy-live-options-view
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download external authorization record (B1)
        uses: actions/download-artifact@v4
        with:
          name: authorization-${{ inputs.revision }}
          path: ${{ github.workspace }}/../.deploy-releases
      - name: Roll back Combined Worker through the gate
        env:
          DEPLOY_RELEASES_DIR: ${{ github.workspace }}/../.deploy-releases
          DEPLOY_REVISION: ${{ inputs.revision }}
          DEPLOY_WEB_CHECK: ${{ inputs.web-check }}
          DEPLOY_API_CHECK: ${{ inputs.api-check }}
          DEPLOY_EXECUTE: ${{ inputs.execute }}
          DEPLOY_ROLLBACK_REASON: ${{ inputs.rollback-reason }}
        run: node scripts/deploy-staged-payload.mjs --deploy --target rollback
