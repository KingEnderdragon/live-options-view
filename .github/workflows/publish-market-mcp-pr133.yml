name: Publish approved market MCP image (PR 133)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-market-mcp-pr133
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'OwenTanzer/live-options-view' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: 1dde53f78709a41c41e17af37c1f9e422626f5af
      IMAGE: ghcr.io/owentanzer/market-mcp-read-only
    steps:
      - name: Check out approved merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 1dde53f78709a41c41e17af37c1f9e422626f5af
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm source is the approved commit on master
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check approved source
        run: |
          node --test market_mcp/*.test.js
          node tests/squeeze_scanner_display.test.js
          node market_mcp/smoke.js --out market-mcp-fixture-smoke.json
          node market_mcp/production-smoke.js --out market-mcp-production-smoke.json
          node --max-old-space-size=256 market_mcp/load.js --out market-mcp-production-load.json
      - name: Build commit-tagged image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f market_mcp/Dockerfile \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/OwenTanzer/live-options-view" \
            -t "$IMAGE:$SOURCE_SHA" .
          test "$(docker image inspect "$IMAGE:$SOURCE_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
      - name: Verify exact image without network access
        shell: bash
        run: bash market_mcp/verify-image.sh "$IMAGE:$SOURCE_SHA"
      - name: Log in to existing GitHub container package
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish once and verify registry digest
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE:$SOURCE_SHA"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo 'The commit tag is already published; refusing to overwrite it.' >&2
            exit 1
          fi
          push_output="$(docker push "$image")"
          digest="$(printf '%s\n' "$push_output" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag_hash="$(docker buildx imagetools inspect --raw "$image" | sha256sum | cut -d ' ' -f 1)"
          digest_hash="$(docker buildx imagetools inspect --raw "$IMAGE@$digest" | sha256sum | cut -d ' ' -f 1)"
          test "sha256:$tag_hash" = "$digest"
          test "sha256:$digest_hash" = "$digest"
          printf 'Published %s@%s from %s\n' "$IMAGE" "$digest" "$SOURCE_SHA"
          printf 'Image: `%s@%s`\nSource commit: `%s`\n' "$IMAGE" "$digest" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

