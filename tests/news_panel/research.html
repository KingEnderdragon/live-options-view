<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Research Harness</title>
<!-- Tests-only harness (MediaFlow P1). Not part of the site. Loads one research projection
     (?src=, a relative path written by `research-view`) and renders it with site/js/news-research.js.
     Colour tokens and type follow site/index.html. -->
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #c9d1d9; --dim: #6e7681; --bright: #f0f6fc;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg); min-height: 100vh; padding: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.85rem; line-height: 1.4;
  }
  #title { font-size: 1.05rem; font-weight: 700; color: var(--bright); margin-bottom: 0.6rem; }
  @media (max-width: 600px) { body { padding: 16px 0; } #title { padding: 0 16px; } }
</style>
</head>
<body>
<div id="title">News research · harness (tests only)</div>
<div id="news-research" aria-live="polite"></div>
<script src="../../site/js/news-research.js"></script>
<script>
  (function () {
    var src = new URLSearchParams(location.search).get('src') || '';
    var box = document.getElementById('news-research');
    if (!/^[A-Za-z0-9_\-./]+\.json$/.test(src) || src.indexOf('..') >= 0) {
      box.setAttribute('data-state', 'failed');
      box.textContent = 'refused: src must be a relative .json path';
      return;
    }
    window.newsResearchReady = fetch(src, { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (view) { return NewsResearch.render(document, box, view); })
      .catch(function (e) { box.setAttribute('data-state', 'failed'); box.textContent = 'Could not load: ' + e.message; });
  })();
</script>
</body>
</html>
