# APPLIED SOURCE — C2 decision packet, 2026-11-11. This is the applied
# asset config at the repo root. It replaces the proposal-only template at
# patches/musef-225/wrangler.assets.toml.proposed (kept as history); the
# stager now prefers this file and stages are config_state='applied-source'.
# The payload/ paths are the staged artifact layout required by the
# validateAssetConfig contract in scripts/prepare-asset-release.mjs:
# build-assets.mjs packages repo site/ -> payload/site and
# frontend/worker.mjs -> payload/frontend/worker.mjs. Wrangler resolves
# the assets directory relative to the stage config at deploy time.
name = "live-options-view"
main = "payload/frontend/worker.mjs"
compatibility_date = "2026-06-23"

[vars]
ENVIRONMENT = "production"
# Supply exact artifact release.json revision through --var ASSET_REVISION:<SHA>.

[assets]
directory = "payload/site"
binding = "ASSETS"
# Reserved API/data requests must execute gateway code, not asset fallback.
run_worker_first = true

[[services]]
binding = "API"
service = "live-options-api"

# Explicitly clear the old combined Worker's schedule; omission may retain it.
[triggers]
crons = []

# No D1, R2, KV, secrets, active cron, producer or recovery binding.
# Nova verifies live asset triggers empty and API sole cron ownership at cutover.
