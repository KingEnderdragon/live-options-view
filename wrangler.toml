name = "live-options-view"
main = "backend/index.js"
compatibility_date = "2026-06-23"
account_id = "413bc8abe4485cf2a2e0d9f534436ade"

# Reconciled twice on 2026-09-28: all 31 existing bot identities matched the
# published roster, including the legacy probe account. See deployment record.
[vars]
BOT_INDEX_READS = "r2"

[assets]
directory = "site"
binding = "ASSETS"

[[r2_buckets]]
binding = "PAPER_TRADES"
bucket_name = "qqq-options-chain-data"

# Issue #208: accounts, sessions and bot markers live in D1. There are no KV
# bindings in this deployment and no migration route in this Worker: the graph
# reaches backend/fence.js and backend/storage.js only, so an ordinary request
# cannot read or write Workers KV.
#
# The legacy USERS/SESSIONS namespaces still exist in the account and their data
# is preserved. They are simply not bound here. Historical migration and recovery
# use the separate, deliberately deployed recovery Worker
# (wrangler.recovery.toml, main = backend/recovery.js) and nothing else; see
# backend/NO_KV.md, "Post-cutover cleanup". D1 is the serving rollback floor: a
# code rollback means deploying a previous D1-reading revision, never serving
# from the stale KV archive.
#
# Schema (already applied for the live database):
#
#   wrangler d1 execute live-options --remote \
#     --file backend/migrations/0001_accounts_sessions.sql
#   wrangler d1 execute live-options --remote \
#     --file backend/migrations/0002_cutover_support.sql
[[d1_databases]]
binding = "DB"
database_name = "live-options"
database_id = "94c7c9ad-228b-471b-b760-48cd18c58d1b"

# Server-side settlement sweep (see the `scheduled` export in worker.js /
# settleAllBots) -- fixes bot accounts that never settle because nothing
# opens their dashboard to fire the client-triggered /api/settle call
# (issue #42). Runs every 15 minutes from 12:00-23:45 UTC on trading days.
# The early window clears anything left from the prior session before the US
# market opens; the late window covers the 16:15 ET same-day cutoff on both
# sides of the EST/EDT boundary. Settlement is idempotent, so repeated runs are
# cheap no-ops once a day's positions are settled.
[triggers]
crons = ["*/15 12-23 * * 1-5"]
